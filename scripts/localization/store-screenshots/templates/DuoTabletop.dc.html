<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Vox.md — iPhone Duo propped · meeting recording</title>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 626px; height: 890px; box-sizing: border-box; background: #0B0B0B; color: #F4F4F1; font-family: Geist, system-ui, sans-serif; display: grid; grid-template-rows: repeat(2, minmax(0, 1fr)); overflow: hidden; position: relative">
  <span aria-hidden="true" style="position: absolute; top: 444px; left: 0; right: 0; height: 2px; background: linear-gradient(to right, rgba(255,255,255,0), rgba(255,255,255,0.08) 20%, rgba(255,255,255,0.08) 80%, rgba(255,255,255,0))"></span>

  <section aria-label="Live transcript" style="padding: 32px 32px 24px; display: flex; flex-direction: column; gap: 16px; overflow: hidden">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="display: inline-flex; align-items: center; gap: 8px; height: 32px; padding: 0 12px 0 6px; border-radius: 999px; background: #1C1C1C; font-size: 14px; font-weight: 600"><span style="width: 22px; height: 22px; border-radius: 999px; background: #2F3BE8; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700">M</span>Meeting Notes</span>
      <span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #9A9A95">On device · 2 speakers</span>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; justify-content: flex-end; gap: 14px; overflow: hidden">
      <div style="display: flex; gap: 12px"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #9A9A95; width: 22px; padding-top: 6px">S1</span><p style="margin: 0; font-size: 20px; line-height: 1.4; font-weight: 500; color: #8A8A85">So the plan is to ship routing first, and keep the composer exactly as calm as it is now.</p></div>
      <div style="display: flex; gap: 12px"><span style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #9A9A95; width: 22px; padding-top: 6px">S2</span><p style="margin: 0; font-size: 24px; line-height: 1.35; font-weight: 500">Agreed. Can we add a task for the release notes and loop in design before Friday<span style="display: inline-block; width: 2px; height: 24px; background: {{rec}}; vertical-align: -4px; margin-left: 3px"></span></p></div>
    </div>
  </section>

  <section aria-label="Recording controls" style="padding: 28px 32px 32px; display: flex; flex-direction: column; gap: 18px; background: #121212">
    <div style="display: flex; align-items: baseline; gap: 12px">
      <span style="width: 10px; height: 10px; border-radius: 999px; background: {{rec}}; align-self: center"></span>
      <span style="font-family: 'Geist Mono', monospace; font-size: 40px; font-weight: 500; letter-spacing: -0.02em">12:48</span>
      <span style="font-size: 13px; color: #9A9A95">Hands-free · keeps going while propped</span>
    </div>
    <div aria-hidden="true" style="height: 56px; display: flex; align-items: center; gap: 3px">
      <sc-for list="{{bars}}" as="b" hint-placeholder-count="56">
        <span style="{{b.style}}"></span>
      </sc-for>
    </div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap">
      <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #2A2A28; background: #1C1C1C; color: #F4F4F1; font-size: 14px; font-weight: 500; cursor: pointer">Mark moment</button>
      <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #2A2A28; background: #1C1C1C; color: #F4F4F1; font-size: 14px; font-weight: 500; cursor: pointer">Add task</button>
      <button style="height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid #2A2A28; background: #1C1C1C; color: #F4F4F1; font-size: 14px; font-weight: 500; cursor: pointer">Snap whiteboard</button>
    </div>
    <div style="margin-top: auto; display: flex; align-items: center; justify-content: center; gap: 40px">
      <button aria-label="Discard recording" style="width: 56px; height: 56px; border-radius: 999px; border: 0; background: #1C1C1C; color: #F4F4F1; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
      <button aria-label="Stop and send" style="width: 88px; height: 88px; border-radius: 999px; border: 3px solid #F4F4F1; background: transparent; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; padding: 0"><span style="width: 34px; height: 34px; border-radius: 8px; background: {{rec}}; display: block"></span></button>
      <button aria-label="Pause" style="width: 56px; height: 56px; border-radius: 999px; border: 0; background: #1C1C1C; color: #F4F4F1; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5v14M15 5v14"></path></svg></button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"rec":{"editor":"color","default":"#F0474A"},"$preview":{"width":626,"height":890}}'>
class Component extends DCLogic {
  renderVals() {
    var rec = this.props.rec ?? '#F0474A';
    var bars = [];
    for (var i = 0; i < 56; i++) {
      var v = Math.round(6 + Math.abs(Math.sin(i * 0.5) * Math.cos(i * 0.17)) * 46);
      bars.push({ style: 'display:block;flex:1;border-radius:2px;height:' + v + 'px;background:' + (i > 47 ? rec : '#3A3A38') });
    }
    return { rec: rec, bars: bars };
  }
}
</script>
</body>
</html>
