<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Vox.md — Voice keyboard</title>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0}
a{color:#2F3BE8}a:hover{color:#1E27B0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #121212; font-family: Geist, system-ui, sans-serif; display: flex; flex-direction: column; overflow: hidden">

  <section aria-label="Any app" style="flex: 1; padding: 64px 16px 12px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; background: #FFFFFF">
    <div style="font-family: 'Geist Mono', monospace; font-size: 11px; color: #6B6B66; text-align: center; margin-bottom: 8px">[Any app with a text field]</div>
    <div style="align-self: flex-start; max-width: 72%; background: #EDEDE8; border-radius: 18px; padding: 10px 14px; font-size: 16px; line-height: 1.35">Are we still on for the review tomorrow?</div>
    <div style="display: flex; align-items: flex-end; gap: 8px; margin-top: 8px">
      <div style="flex: 1; min-height: 40px; border: 1px solid #DEDED8; border-radius: 20px; padding: 9px 14px; box-sizing: border-box; font-size: 16px; line-height: 1.35">Yes — 10am works. I'll bring the routing mockups<span style="display: inline-block; width: 2px; height: 18px; background: #2F3BE8; vertical-align: -3px; margin-left: 2px"></span></div>
    </div>
  </section>

  <section aria-label="Vox.md keyboard" style="height: 384px; box-sizing: border-box; background: #121212; color: #F4F4F1; padding: 12px 12px 30px; display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 8px">
      <div role="group" aria-label="Destination" style="display: inline-flex; padding: 3px; gap: 2px; background: #242424; border-radius: 999px">
        <button aria-pressed="true" style="height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: #F4F4F1; color: #121212; font-size: 13px; font-weight: 600; cursor: pointer">Type here</button>
        <button aria-pressed="false" style="height: 30px; padding: 0 12px; border: 0; border-radius: 999px; background: transparent; color: #B4B4AF; font-size: 13px; font-weight: 500; cursor: pointer">Send to Tasks</button>
      </div>
      <span style="font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #F0474A">● 0:07</span>
    </div>

    <div role="toolbar" aria-label="Quick actions" style="display: flex; gap: 6px; align-items: center; overflow-x: auto; scrollbar-width: none">
      <button aria-label="Task" style="height: 32px; min-width: 32px; padding: 0 9px; border-radius: 9px; border: 0; background: #242424; color: #F4F4F1; font-family: 'Geist Mono', monospace; font-size: 12.5px; cursor: pointer; flex-shrink: 0">- [ ]</button>
      <button aria-label="Link note" style="height: 32px; min-width: 32px; padding: 0 9px; border-radius: 9px; border: 0; background: #242424; color: #F4F4F1; font-family: 'Geist Mono', monospace; font-size: 12.5px; cursor: pointer; flex-shrink: 0">[[ ]]</button>
      <button aria-label="Tag" style="height: 32px; min-width: 32px; padding: 0 9px; border-radius: 9px; border: 0; background: #242424; color: #F4F4F1; font-family: 'Geist Mono', monospace; font-size: 12.5px; cursor: pointer; flex-shrink: 0">#</button>
      <button aria-label="Time" style="height: 32px; min-width: 32px; padding: 0 9px; border-radius: 9px; border: 0; background: #242424; color: #F4F4F1; font-family: 'Geist Mono', monospace; font-size: 12.5px; cursor: pointer; flex-shrink: 0">10:42</button>
      <button aria-label="Location" style="height: 32px; min-width: 32px; padding: 0 9px; border-radius: 9px; border: 0; background: #242424; color: #F4F4F1; font-family: 'Geist Mono', monospace; font-size: 12.5px; cursor: pointer; flex-shrink: 0">◎</button>
      <span style="margin-left: auto; flex-shrink: 0; white-space: nowrap; font-size: 11.5px; color: #8E8E89">Tasks pins</span>
    </div>

    <div style="font-size: 15px; line-height: 1.4; color: #8E8E89; min-height: 42px">and the updated presets <span style="color: #5F5F5B">list…</span></div>

    <div style="flex: 1; display: flex; align-items: center; justify-content: center; gap: 20px">
      <button aria-label="Delete last phrase" style="width: 52px; height: 52px; border-radius: 999px; border: 0; background: #242424; color: #F4F4F1; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11v12H9l-6-6z"></path><path d="M13 10l4 4M17 10l-4 4"></path></svg>
      </button>
      <button aria-label="Stop dictation" style="width: 96px; height: 96px; border-radius: 999px; border: 0; background: #F0474A; box-shadow: 0 0 0 10px rgba(240,71,74,0.18), 0 0 0 22px rgba(240,71,74,0.08); color: #FFFFFF; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="34" height="34" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="3" width="6" height="12" rx="3"></rect><path d="M5 11a7 7 0 0 0 14 0M12 18v3"></path></svg>
      </button>
      <button aria-label="Insert return" style="width: 52px; height: 52px; border-radius: 999px; border: 0; background: #242424; color: #F4F4F1; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="20" height="20" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 5v7a3 3 0 0 1-3 3H5M9 11l-4 4 4 4"></path></svg>
      </button>
    </div>

    <div style="display: flex; gap: 8px">
      <button aria-label="Next keyboard" style="width: 44px; height: 40px; border: 0; border-radius: 10px; background: #242424; color: #F4F4F1; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
        <svg aria-hidden="true" width="18" height="18" sc-camel-view-box="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c3 3.5 3 14.5 0 18M12 3c-3 3.5-3 14.5 0 18"></path></svg>
      </button>
      <button style="flex: 1; height: 40px; border: 0; border-radius: 10px; background: #242424; color: #B4B4AF; font-size: 14px; cursor: pointer">space</button>
      <button style="width: 64px; height: 40px; border: 0; border-radius: 10px; background: #242424; color: #F4F4F1; font-size: 14px; font-weight: 600; cursor: pointer">ABC</button>
    </div>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:844}}">
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>


</body></html>
