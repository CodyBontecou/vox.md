<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<title>Vox.md — Mac quick capture</title>
</head>
<body>
<x-dc>
<helmet>
<style></style>
<style>
body{margin:0}
a{color:#2F3BE8}a:hover{color:#1E27B0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 520px; height: 560px; box-sizing: border-box; padding: 24px; background: #CFCFC8; font-family: Geist, system-ui, sans-serif; color: #121212; display: flex">
  <section aria-label="Quick capture" style="flex: 1; background: #FBFBF9; border-radius: 18px; box-shadow: 0 0 0 1px rgba(0,0,0,0.08), 0 24px 60px rgba(0,0,0,0.18); display: flex; flex-direction: column; overflow: hidden">
    <div role="tablist" aria-label="Route" style="display: flex; gap: 6px; padding: 14px 14px 0; flex-wrap: wrap">
      <sc-for list="{{routes}}" as="r" hint-placeholder-count="4">
        <button role="tab" aria-selected="{{r.sel}}" style="{{r.style}}"><span style="{{r.dot}}"></span>{{r.name}}<span style="font-family: 'Geist Mono', monospace; font-size: 10.5px; opacity: 0.7">{{r.key}}</span></button>
      </sc-for>
    </div>

    <div style="flex: 1; padding: 20px 22px; display: flex; flex-direction: column; gap: 12px">
      <div style="font-size: 20px; line-height: 1.45">Call with Dana: pricing page needs a monthly toggle<span style="display: inline-block; width: 2px; height: 22px; background: #2F3BE8; vertical-align: -4px; margin-left: 2px"></span></div>
      <div style="font-size: 20px; line-height: 1.45; color: #8A8A85">- [ ] </div>
      <div style="margin-top: auto; display: flex; align-items: center; gap: 10px; background: #121212; color: #F4F4F1; border-radius: 12px; padding: 10px 12px">
        <span style="width: 8px; height: 8px; border-radius: 999px; background: #F0474A"></span>
        <span style="font-family: 'Geist Mono', monospace; font-size: 12px">0:12</span>
        <div aria-hidden="true" style="flex: 1; display: flex; align-items: center; gap: 2px; height: 20px">
          <sc-for list="{{bars}}" as="b" hint-placeholder-count="40"><span style="{{b}}"></span></sc-for>
        </div>
        <span style="font-size: 12px; color: #9A9A95">hold ⌥Space</span>
      </div>
    </div>

    <footer style="border-top: 1px solid #E6E6E0; padding: 12px 14px; display: flex; align-items: center; gap: 10px">
      <span style="flex: 1; min-width: 0; font-family: 'Geist Mono', monospace; font-size: 11.5px; color: #5E5E5A; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">→ Tasks.md › ## Today</span>
      <span style="font-size: 12px; color: #5E5E5A">esc to close</span>
      <button style="height: 34px; padding: 0 14px; border-radius: 9px; border: 0; background: #2F3BE8; color: #FFFFFF; font-size: 13.5px; font-weight: 600; cursor: pointer">Send ⌘↩</button>
    </footer>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script="" data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:560}}">
class Component extends DCLogic {
  renderVals() {
    var list = [
      { name: 'Meetings', key: '⌘1', c: '#2F3BE8' },
      { name: 'Inbox', key: '⌘2', c: '#121212' },
      { name: 'Journal', key: '⌘3', c: '#A3A39E' },
      { name: 'Tasks', key: '⌘4', c: '#A3A39E', sel: true }
    ];
    var bars = [];
    for (var i = 0; i < 40; i++) {
      var v = Math.round(3 + Math.abs(Math.sin(i * 0.7) * Math.cos(i * 0.3)) * 16);
      bars.push('display:block;flex:1;border-radius:1px;height:' + v + 'px;background:' + (i > 33 ? '#F0474A' : '#4A4A47'));
    }
    return {
      bars: bars,
      routes: list.map(function (r) {
        return {
          name: r.name, key: r.key, sel: r.sel ? 'true' : 'false',
          style: 'display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 10px;border-radius:999px;font-size:13px;cursor:pointer;' + (r.sel ? 'background:#121212;color:#FFFFFF;border:1px solid #121212;font-weight:600' : 'background:#FFFFFF;color:#121212;border:1px solid #DEDED8'),
          dot: 'width:8px;height:8px;border-radius:999px;background:' + (r.sel ? '#FFFFFF' : r.c)
        };
      })
    };
  }
}
</script>


</body></html>
