# Walks the Vox.md Wear OS screens used for the Play Store Wear screenshots:
# Ready -> Recording -> Paused -> Stop (saved on watch). The preset chip exposes no text or id
# to the runner tree, so the Capture Preset picker is not covered here.
#
# Prerequisites: Wear OS emulator (AVD vox-wear-os5-large-round, Wear OS 5, 454x454 round) with
#   the Wear debug APK installed (./gradlew -p apps/android :wear:assembleDebug) and the
#   microphone and notification permissions granted. No phone pairing is needed.
# Side effects: records a ~5 s audio clip that stays in the watch's saved-recordings queue
#   (no paired phone to sync to). Discard it from Review recordings, or wipe app data.
# Store captures: run `adb exec-out screencap -p` at each state; outputs live in
#   apps/android/play-console/graphics/screenshots/wear/raw/.
# While a recording runs, `describe` (android-devtools) stops refreshing; the runner tree used
#   here still exposes the control glyphs, so Pause and Stop are matched by their fixed glyphs.
version: 1
requires:
  platform: android
steps:
  - echo: Restart Vox.md on Wear. Expect the Ready recorder screen
  - launch: md.vox.android
  - await:
      visible:
        text: Start Watch recording
      timeout: 10000
  - await: { idle: true }
  - echo: On Ready. Tap REC to start recording
  - tap:
      text: REC
  - echo: Recording. Tap Pause, then Stop to save the clip on the watch
  - tap:
      text: Ⅱ
  - tap:
      text: ■
  - await:
      visible:
        text: Start Watch recording
      timeout: 10000
