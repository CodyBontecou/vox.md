# Walks the redesigned Vox.md Wear OS screens used for the Play Store Wear screenshots:
# Speak to… -> tap Daily (records) -> Pause below the fold -> Stop -> result screen (Speak again).
#
# Prerequisites: Wear OS emulator (AVD vox-wear-os5-large-round, Wear OS 5, 454x454 round) with
#   the Wear debug APK installed (./gradlew -p apps/android :wear:assembleDebug) and the
#   microphone and notification permissions granted. No phone pairing is needed; without one
#   the result screen reads "Saved on Watch", with a connected phone "Sent to Daily".
# Side effects: records a short audio clip that stays in the watch queue until a phone syncs it.
#   Clear with `adb shell pm clear md.vox.android` (then re-grant permissions).
# Store captures: run `adb exec-out screencap -p` at each state; outputs live in
#   apps/android/play-console/graphics/screenshots/wear/raw/.
# While a recording runs, `describe` (android-devtools) stops refreshing; the runner tree used
#   by these steps still resolves the controls.
version: 1
requires:
  platform: android
steps:
  - echo: Restart Vox.md on Wear. Expect the Speak to… preset list
  - launch: md.vox.android
  - await:
      visible:
        text: Speak to…
      timeout: 10000
  - await: { idle: true }
  - echo: On Speak to…. Tap the Daily preset to start recording. Expect the Stop edge button
  - tap:
      text: Start Watch recording
  - await:
      visible:
        text: Stop Watch recording
      timeout: 10000
  - echo: Recording. Scroll below the fold to Pause and tap it
  - scroll-to:
      target:
        text: Pause
  - tap:
      text: Pause
  - echo: Paused. Tap Stop and expect the result screen with Speak again
  - tap:
      text: Stop
  - await:
      visible:
        text: Speak again
      timeout: 15000
