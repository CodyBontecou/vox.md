# Speak's "Record into a new note" segment, tapped (Android parity for iOS
# #175, owner's design 2026-11-26): one tap on the icon at Speak's trailing end
# closes the open Live Note, starts a blank note and records into it. The
# recording is then discarded, so nothing is transcribed or written.
#
# Contract:
#  - Baseline: the Vox QA note capture-c2d2e1cc-….md is open and the segment
#    is visible.
#  - Tapping it shows the blank note's planned path (capture-{id}.md) with the
#    recording dock (Discard present).
#  - Discard → confirm: the dock goes away, Speak is idle, and on the blank note
#    the segment is hidden (Speak already records into a new note there).
#
# Prerequisites: the owner's Pixel 7 (debug md.vox.android) with the Vox QA
#   vault, whose composer reopens Inbox/capture-c2d2e1cc-a45e-4818-80df-
#   2a9d3d3581ed.md on launch; microphone permission granted; English UI.
# Side effects:
#  - RECORDS a few seconds of microphone audio, then discards it.
#  - Leaves the composer on a blank note. The original note is released (not
#    modified); reopen it from Files before running again. The released-note
#    "Reopen" toast lasts 6 s, which a replay can't reach before the discard,
#    and argent's tree goes stale on Files on this phone, so the reset is not
#    automated.
#  - Discard deletes the session's audio chunks (ConfirmedRecordingDiscard);
#    its small manifest stays in no_backup/recordings/<id>/ as a cancelled
#    recording without audio. Check with `adb shell run-as md.vox.android ls`
#    after a run; remove that folder to leave no trace.
# Selectors: "Discard Recording" is matched by its label because the confirm
#   dialog is a separate window whose test tags are not exposed.
version: 1
requires:
  platform: android
steps:
  - echo: Restart Vox.md on the open Vox QA note; expect Speak's Record into a new
      note segment
  - launch: md.vox.android
  - await: { visible: { id: capture-speak-record-new-note }, timeout: 15000 }
  - await: { idle: true }
  - await: { text: { in: { id: live-note-path }, contains: capture-c2d2e1cc-a45e-4818-80df-2a9d3d3581ed.md } }
  - echo: Tap Record into a new note; expect a blank note recording
  - tap: { id: capture-speak-record-new-note }
  - await: { visible: { id: capture-recording-discard }, timeout: 8000 }
  - await: { idle: true }
  - await: { text: { in: { id: live-note-path }, contains: "capture-{id}.md" } }
  - echo: Discard the recording; Speak must be idle and the segment hidden on the
      blank note
  - tap: { id: capture-recording-discard }
  - tap: { text: Discard Recording }
  - await: { hidden: { id: capture-recording-discard }, timeout: 8000 }
  - await: { text: { in: { id: capture-speak }, contains: Start voice capture }, timeout: 8000 }
  - await: { hidden: { id: capture-speak-record-new-note } }
