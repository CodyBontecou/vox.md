# App Store review prompt (iOS): after an in-app success the user saw (finishing
# a Live Note with New note), the system review sheet appears only once the
# closed-note toast has gone.
#
# Prerequisites: iOS simulator with a DEBUG build of Vox.md (bontecou.Voxboard)
#   installed. `-VoxAdaptiveSeedDemo` creates the local "Vox Notes" demo vault and
#   starter routes and fills the draft, which Live Notes saves (one delivered
#   capture). `-VoxReviewPromptSeed` sets the review counter to 4 delivered
#   captures with a delivery day yesterday and clears any earlier request, so the
#   seeded save makes 5 captures on 2 days. `-VoxScreenshotUnlocked` gives active
#   access for this launch. Debug builds always show the StoreKit sheet.
#   Do not add `-VoxAdaptiveNoAutofocus`: it holds the release-notes focus
#   deferral on, which (correctly) blocks the prompt.
# Side effects: appends the seed draft to today's Meetings note in the demo vault
#   on every run; records a review request in the app's shared defaults (the
#   seed clears it again on the next run). Uninstall the app to reset.
# Selectors: waits stay raw `tool: await-ui-element` steps because the runner's
#   directive tree lacks the composer controls (see capture-route-label-suffix).
#   The three taps are documented coordinates for a 6.9-inch iPhone simulator
#   (iPhone 18 Pro Max): the recorder resolved the composer taps to the
#   full-screen "Toolbar" group or the text view, and the StoreKit sheet runs in
#   another process the runner cannot target.
version: 1
requires:
  platform: ios
steps:
  - echo: Launch Vox.md (DEBUG) with the demo vault and the review counter one
      delivery short of eligible. Expect the composer
  - launch:
      native: bontecou.Voxboard
      ios:
        app: bontecou.Voxboard
        args:
          - --disable-release-notes
          - -VoxScreenshotUnlocked
          - -VoxAdaptiveSeedDemo
          - -VoxReviewPromptSeed
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: capture_new_note
      timeoutMs: 20000
  - echo: "The demo seed fills the draft and Live Notes saves it: the fifth
      delivered capture, on a second day. Wait for Saved"
  - tool: await-ui-element
    args:
      condition: text
      selector:
        identifier: live_note_status
      expectedText: Saved
      textMatch: equals
      timeoutMs: 25000
  - echo: The composer autofocuses with the keyboard up. Tap Done to put the
      keyboard away so New note sits at a fixed spot
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: capture_done_typing
      timeoutMs: 10000
  # Done (capture_done_typing), keyboard shown: frame (0.820,0.073,0.134,0.046)
  - tap:
      x: 0.887
      y: 0.096
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: capture_settings
      timeoutMs: 10000
  - echo: Tap New note to finish the note (the in-app success moment). Expect the
      closed-note toast first
  # New note (capture_new_note), keyboard hidden: frame (0.845,0.895,0.118,0.054)
  - tap:
      x: 0.904
      y: 0.922
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        identifier: live_note_reopen
      timeoutMs: 5000
  - echo: The toast leaves after ~6 s; only then does the system review sheet appear
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        identifier: live_note_reopen
      timeoutMs: 10000
  - tool: await-ui-element
    args:
      condition: visible
      selector:
        text: Not Now
      timeoutMs: 10000
  # StoreKit sheet "Not Now": frame (0.173,0.606,0.655,0.053)
  - tap:
      x: 0.5
      y: 0.632
  - tool: await-ui-element
    args:
      condition: hidden
      selector:
        text: Not Now
      timeoutMs: 10000
